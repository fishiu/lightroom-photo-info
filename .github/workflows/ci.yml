name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      ARCH: arm64
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run regression tests
        run: ./test.sh
      - name: Build and verify release package
        run: ./scripts/package-release.sh
      - name: Inspect deployment target
        run: xcrun vtool -show-build "build/Lightroom Photo Info.app/Contents/MacOS/LightroomPhotoInfo"
