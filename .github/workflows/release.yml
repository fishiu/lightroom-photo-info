name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      ARCH: arm64
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run regression tests
        run: ./test.sh
      - name: Build and verify release package
        run: ./scripts/package-release.sh
      - name: Verify tag matches app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "build/Lightroom Photo Info.app/Contents/Info.plist")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Tag %s does not match app version v%s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
      - name: Publish Apple Silicon download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > build/release-notes.md <<'NOTES'
          ### 下载 / Download

          - 下载 `.zip`，解压后将 app 拖入“应用程序”。适用于 Apple Silicon Mac；构建最低系统版本为 macOS 13。
          - Download the `.zip`, extract it, and move the app to Applications. Apple Silicon only; built with a macOS 13 deployment target.
          - 首次使用需要在系统设置中授予“辅助功能”权限。完整步骤及兼容性说明见项目 README。
          - Accessibility permission is required. See the project README for installation and compatibility details.
          - 相册范围无法读取时，可通过菜单栏“相册识别权限…”开启屏幕录制权限。仅在本机识别相册文字区域，不保存或上传截图；更新后可能需要重新开启辅助功能权限。
          - For inaccessible album labels, the menu-bar album-recognition action enables optional Screen Recording access. Only album text regions are recognized locally; screenshots are never saved or uploaded. Updates may require re-enabling Accessibility access.

          **签名说明 / Signing:** This build is ad-hoc signed, without an Apple Developer ID certificate or Apple notarization. macOS may block the first launch; follow the README's standard macOS instructions. The `.sha256` file verifies download integrity.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            build/releases/*.zip build/releases/*.sha256 \
            --verify-tag --title "Lightroom Photo Info $GITHUB_REF_NAME" \
            --notes-file build/release-notes.md --generate-notes
