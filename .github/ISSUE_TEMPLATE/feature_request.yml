name: 改进建议
description: 提出一个能改善修图体验的需求
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 你遇到的需求
      description: 描述具体场景，以及当前使用上有什么不便。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望如何改进
      description: 可以描述理想行为，也可以提供简单示意。请使用虚构数据或脱敏截图。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选：目前的替代办法
    validations:
      required: false
